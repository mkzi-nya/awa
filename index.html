<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>awa</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f14;font-family:sans-serif}
input,button{padding:10px;font-size:14px;border-radius:6px;border:1px solid #333;background:#111;color:#eee}
button{cursor:pointer}
</style>
</head>
<body>
<input id="pwd" type="text">
<button id="go">OK</button>
<script>
const $=id=>document.getElementById(id)
const log=(...a)=>console.log("[awa]",...a)
const MAP_KEY="pwd_dir_map"

function toUnicodeEscape(s){
let o=""
for(const c of s)o+="\\u"+c.codePointAt(0).toString(16).padStart(4,"0")
return o
}

function getDirMap(){
try{return JSON.parse(localStorage.getItem(MAP_KEY)||"{}")}catch{return{}}
}

function setDirMap(m){
localStorage.setItem(MAP_KEY,JSON.stringify(m))
}

function bindDirPwd(dir,pwd){
const m=getDirMap()
m[dir]=pwd
setDirMap(m)
log("bindDirPwd",dir,pwd)
}

function getDirPwd(dir){
return getDirMap()[dir]||""
}

async function registerSW(){
log("registerSW:start")
const r=await navigator.serviceWorker.register("./sw.js",{scope:"./"})
await navigator.serviceWorker.ready
log("registerSW:ready",!!navigator.serviceWorker.controller)
return r
}

async function ensureController(){
if(navigator.serviceWorker.controller){
log("ensureController:already")
return
}
log("ensureController:wait")
await new Promise(r=>navigator.serviceWorker.addEventListener("controllerchange",()=>{log("controllerchange");r()},{once:true}))
}

async function pingSW(){
await registerSW()
await ensureController()

log("pingSW:setup listener")

return new Promise((resolve,reject)=>{
let done=false

const onMsg=e=>{
if(e.data&&e.data.type==="SW_READY"){
log("pingSW:got SW_READY")
done=true
navigator.serviceWorker.removeEventListener("message",onMsg)
resolve()
}
}

navigator.serviceWorker.addEventListener("message",onMsg)

log("pingSW:send")
navigator.serviceWorker.controller.postMessage({type:"PING"})

setTimeout(()=>{
if(done)return
navigator.serviceWorker.removeEventListener("message",onMsg)
console.warn("ping timeout → continue")
resolve()
},2000)
})
}

async function setPasswords(list){
await pingSW()
const uniq=[...new Set(list.filter(Boolean))]
log("setPasswords",uniq)
navigator.serviceWorker.controller.postMessage({type:"SET_PASSWORDS",passwords:uniq})
}

function isHTML(t){
t=t.slice(0,800).toLowerCase()
return t.includes("<html")||t.includes("<!doctype")
}

async function fetchList(){
log("fetchList:start")
const r=await fetch("./main/main.txt",{cache:"no-store"})
const t=await r.text()
const list=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)
log("fetchList:done",list)
return list
}

function splitPath(p){
if(!p)return{path:"",query:""}
const i=p.indexOf("?")
if(i===-1)return{path:p,query:""}
return{path:p.slice(0,i),query:p.slice(i)}
}

function normalizePath(p){
if(!p)return""
return p.replace(/^\/+/,"")
}

function parseInput(v){
if(!v)return null
if(v.startsWith("?")){
const q=new URLSearchParams(v.slice(1))
return{
pwd:q.get("pwd")||"",
path:normalizePath(q.get("path")||q.get("url")||"")
}
}
return{
pwd:v,
path:""
}
}

async function probeUrl(u){
log("probeUrl",u)
const r=await fetch(u,{cache:"no-store"})
if(!r.ok){
log("probeUrl:not ok",r.status,u)
return false
}
const t=await r.text()
const ok=isHTML(t)
log("probeUrl:isHTML",ok,u)
return ok
}

async function tryPathWithPwd(pwd,path,hash){
const dirs=await fetchList()
const {path:sub,query}=splitPath(path)
const map=getDirMap()
for(const d of dirs){
const bound=map[d]
if(bound&&bound!==pwd){
log("tryPathWithPwd:skip bound dir",d,bound)
continue
}
const base="./main/"+encodeURIComponent(d)+"/"
const u=base+sub+query
await setPasswords([pwd])
try{
if(await probeUrl(u)){
bindDirPwd(d,pwd)
location.href=u+(hash||"")
return true
}
}catch(e){
log("tryPathWithPwd:error",d,e)
}
}
return false
}

async function tryPwdTraverse(pwd,hash){
const dirs=await fetchList()
const map=getDirMap()
for(const d of dirs){
const bound=map[d]
if(bound&&bound!==pwd){
log("tryPwdTraverse:skip bound dir",d,bound)
continue
}
const u="./main/"+encodeURIComponent(d)+"/index.html"
await setPasswords([pwd])
try{
if(await probeUrl(u)){
bindDirPwd(d,pwd)
location.href=u+(hash||"")
return true
}
}catch(e){
log("tryPwdTraverse:error",d,e)
}
}
return false
}

async function run(v){
const parsed=parseInput(v)
log("run:parsed",parsed)
if(!parsed||!parsed.pwd)return
const pwd=toUnicodeEscape(parsed.pwd)
const hash=location.hash
if(parsed.path){
await tryPathWithPwd(pwd,parsed.path,hash)
return
}
await tryPwdTraverse(pwd,hash)
}

async function auto(){
const raw=location.search
if(raw){
$("pwd").value=raw
log("auto",raw,location.hash)
await run(raw)
}
}

async function go(){
const v=$("pwd").value.trim()
if(!v)return
log("go",v)
await run(v)
}

$("go").onclick=go
$("pwd").onkeydown=e=>{if(e.key==="Enter")go()}

auto()
</script>
</body>
</html>
